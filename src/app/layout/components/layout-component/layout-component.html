<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            My Application
        </div>

        <nav class="nav-menu">

            <a routerLink="/dashboard"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }"
               class="nav-item">
                <span>🏠</span>
                <span>Dashboard</span>
            </a>

            <a routerLink="/users"
               routerLinkActive="active"
               class="nav-item">
                <span>👤</span>
                <span>Users</span>
            </a>

            <a routerLink="/products"
               routerLinkActive="active"
               class="nav-item">
                <span>📦</span>
                <span>Products</span>
            </a>

            <a routerLink="/orders"
               routerLinkActive="active"
               class="nav-item">
                <span>📑</span>
                <span>Orders</span>
            </a>

            <a routerLink="/reports"
               routerLinkActive="active"
               class="nav-item">
                <span>📊</span>
                <span>Reports</span>
            </a>

            <a routerLink="/settings"
               routerLinkActive="active"
               class="nav-item">
                <span>⚙️</span>
                <span>Settings</span>
            </a>

        </nav>

    </aside>

    <!-- Main Content -->
    <div class="main">

        <!-- Header -->
        <header class="header">

            <div class="left">

                <h2>Dashboard</h2>

                <small>
                    Welcome,
                    <strong>{{ user?.fullName || 'User' }}</strong>
                </small>

            </div>

            <div class="right">

                <div class="search">
                    <input type="text" placeholder="Search..." />
                </div>

                <!-- Avatar -->
                <div class="avatar">
                    {{ user?.fullName ? user.fullName.charAt(0) : 'U' }}
                </div>

                <!-- User Details -->
                <div class="user-info" *ngIf="user">
                    <strong>{{ user.fullName }}</strong><br>
                    <small>{{ user.role }}</small>
                </div>

                <!-- Logout -->
                <button
                    type="button"
                    class="logout-btn"
                    (click)="logout()">
                    Logout
                </button>

            </div>

        </header>

        <!-- Page Content -->
        <div class="page">
            <router-outlet></router-outlet>
        </div>

    </div>

</div>
