<p-table
    #table
    [value]="employees"
    [paginator]="true"
    [rows]="5"
    [rowsPerPageOptions]="[5,10,20]"
    [globalFilterFields]="[
      'employeeCode',
      'firstName',
      'lastName',
      'email',
      'phone'
    ]">

    <ng-template #header>
        <tr>
            <th>ID</th>
            <th>Code</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Salary</th>
            <th>Joining Date</th>
            <th>Department</th>
        </tr>
    </ng-template>

    <ng-template #body let-emp>
        <tr>
            <td>{{ emp.id }}</td>
            <td>{{ emp.employeeCode }}</td>
            <td>{{ emp.firstName }}</td>
            <td>{{ emp.lastName }}</td>
            <td>{{ emp.email }}</td>
            <td>{{ emp.phone }}</td>
            <td>{{ emp.salary }}</td>
            <td>{{ emp.joiningDate | date:'dd/MM/yyyy' }}</td>
            <td>{{ emp.departmentId }}</td>
        </tr>
    </ng-template>

    <ng-template #emptymessage>
        <tr>
            <td colspan="9">No Employees Found</td>
        </tr>
    </ng-template>

</p-table>
